spring.application.name=nagarsetu
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nagarsetu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Shared secret for the authority dashboard (status updates). Override in production.
app.admin-key=${ADMIN_KEY:demo-admin}
# Seed clearly-labelled demo reports when the database is empty.
app.seed-demo-data=${SEED_DEMO_DATA:true}
